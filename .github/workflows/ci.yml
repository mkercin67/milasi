name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks (typecheck, tests, build)
        run: npm run check

      - name: Install Playwright Chromium dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Playwright smoke test against preview
        run: npm run smoke

      - name: Run Playwright i18n DOM verification (Turkish & English, all dialogs)
        run: node scripts/test_i18n_dom.mjs

      - name: Run Playwright voice entry E2E verification (T7, T8)
        timeout-minutes: 10
        run: node scripts/test_voice_entry_e2e.mjs

      - name: Run Playwright voice selection E2E
        timeout-minutes: 10
        run: node scripts/test_voice_selection_e2e.mjs

      - name: Run Playwright keyboard two-voice entry E2E (M7a-4 T7)
        timeout-minutes: 10
        run: node scripts/test_two_voice_keyboard_e2e.mjs

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-failure-artifacts
          path: artifacts/
          retention-days: 7

      - name: Verify no orphan background preview or vite processes
        if: always()
        run: |
          echo "Checking for orphan vite processes..."
          if pgrep -af "vite preview|vite.js"; then
            echo "Error: Orphan vite/preview process detected!"
            exit 1
          else
            echo "No orphan vite processes found."
          fi
