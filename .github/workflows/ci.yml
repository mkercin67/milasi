name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks (typecheck, tests, build)
        run: npm run check

      - name: Install Playwright Chromium dependencies
        run: npx playwright install chromium --with-deps

      - name: Run Playwright smoke test against preview
        run: npm run smoke

      - name: Run Playwright i18n DOM verification (Turkish & English, all dialogs)
        run: node scripts/test_i18n_dom.mjs

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-artifacts
          path: artifacts/
          retention-days: 7
